
name: Python Static Code Analysis

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pylint bandit flake8 requests

      - name: Run Pylint
        run: |
          python -m pylint attendance_tracker.py > pylint_report.txt || true

      - name: Run Bandit
        run: |
          python -m bandit -r attendance_tracker.py -f txt -o bandit_report.txt || true

      - name: Run Flake8
        run: |
          python -m flake8 attendance_tracker.py > flake8_report.txt || true

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            pylint_report.txt
            bandit_report.txt
            flake8_report.txt
